{% extends "base.html" %}

{% block title %}{% if room %}تعديل غرفة{% else %}إضافة غرفة{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-lg-9">

<div class="card p-4">
    <h3 class="mb-4">
        {% if room %}✏️ تعديل الغرفة{% else %}➕ إضافة غرفة جديدة{% endif %}
    </h3>

    <form method="post">
        {% csrf_token %}

        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">اسم الغرفة</label>
                <input type="text" name="name" class="form-control"
                       value="{{ room.name|default:'' }}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">رقم الغرفة</label>
                <input type="text" name="room_number" class="form-control"
                       value="{{ room.room_number|default:'' }}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">نوع الغرفة</label>
                <select name="room_type" class="form-select">
                    {% for value,label in room_types %}
                    <option value="{{ value }}"
                        {% if room.room_type == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">القسم</label>
                <select name="department" class="form-select">
                    <option value="">-- اختر القسم --</option>
                    {% for department in departments %}
                    <option value="{{ department.id }}"
                        {% if room.department_id == department.id %}selected{% endif %}>
                        {{ department.name_ar }} - {{ department.name_en }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">الطابق</label>
                <input type="text" name="floor" class="form-control"
                       value="{{ room.floor|default:'' }}">
            </div>

            <div class="col-md-4">
                <label class="form-label">السعة</label>
                <input type="number" name="capacity" min="1"
                       class="form-control"
                       value="{{ room.capacity|default:1 }}">
            </div>

            <div class="col-md-4">
                <label class="form-label">الهاتف</label>
                <input type="text" name="phone" class="form-control"
                       value="{{ room.phone|default:'' }}">
            </div>

            <div class="col-12">
                <label class="form-label">ملاحظات</label>
                <textarea name="notes" class="form-control" rows="4">{{ room.notes|default:'' }}</textarea>
            </div>

        </div>

        <div class="mt-4">
            <button class="btn btn-primary">💾 حفظ</button>
            <a href="{% url 'inpatient:room_list' %}" class="btn btn-secondary">
                رجوع
            </a>
        </div>
    </form>
</div>

</div>
</div>
{% endblock %}
