{% extends "base.html" %}
{% block content %}
<style>.form-page{max-width:1000px;margin:auto}.card,.form-card{border:1px solid #e5eaf1;box-shadow:0 8px 24px rgba(15,23,42,.06);border-radius:16px}</style>
<div dir="rtl" class="container py-4">

<h2 class="mb-4">{{ title }}</h2>

<form method="post" class="card shadow-sm p-4">
{% csrf_token %}

<div class="row g-3">

<div class="col-md-6">
<label class="form-label">اسم الجهاز</label>
<input name="name" class="form-control"
       value="{{ device.name|default:'' }}" required>
</div>

<div class="col-md-6">
<label class="form-label">الشركة المصنعة</label>
<input name="manufacturer" class="form-control"
       value="{{ device.manufacturer|default:'' }}">
</div>

<div class="col-md-6">
<label class="form-label">Model</label>
<input name="model" class="form-control"
       value="{{ device.model|default:'' }}">
</div>

<div class="col-md-6">
<label class="form-label">Serial Number</label>
<input name="serial_number" class="form-control"
       value="{{ device.serial_number|default:'' }}">
</div>

<div class="col-md-6">
<label class="form-label">القسم</label>
<select name="department" class="form-select">
<option value="">-- اختر القسم --</option>
{% for department in departments %}
<option value="{{ department.id }}"
{% if device.department_id == department.id %}selected{% endif %}>
{{ department.name_ar }} - {{ department.name_en }}
</option>
{% endfor %}
</select>
</div>

<div class="col-md-6">
<label class="form-label">الحالة</label>
<select name="status" class="form-select">
{% for value,label in status_choices %}
<option value="{{ value }}"
{% if device.status == value or not device and value == "ACTIVE" %}selected{% endif %}>
{{ label }}
</option>
{% endfor %}
</select>
</div>

<div class="col-12">
<label class="form-label">ملاحظات</label>
<textarea name="notes" class="form-control" rows="3">{{ device.notes|default:'' }}</textarea>
</div>

<div class="col-12">
<div class="form-check">
<input type="checkbox" name="is_active" class="form-check-input"
       {% if not device or device.is_active %}checked{% endif %}>
<label class="form-check-label">الجهاز نشط</label>
</div>
</div>

</div>

<div class="mt-4">
<button class="btn btn-success">حفظ</button>
<a href="{% url 'laboratory:device_list' %}" class="btn btn-secondary">إلغاء</a>
</div>

</form>
</div>
{% endblock %}
