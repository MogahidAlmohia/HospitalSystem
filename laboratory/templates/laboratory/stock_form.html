{% extends "base.html" %}
{% block content %}
<style>.form-page{max-width:1000px;margin:auto}.card,.form-card{border:1px solid #e5eaf1;box-shadow:0 8px 24px rgba(15,23,42,.06);border-radius:16px}</style>
<div dir="rtl" class="container py-4">

<h2 class="mb-4">{{ title }}</h2>

<form method="post" class="card shadow-sm p-4">
{% csrf_token %}

<div class="row g-3">

<div class="col-md-6">
<label class="form-label">الكاشف</label>
<select name="reagent" class="form-select" required>
<option value="">-- اختر الكاشف --</option>
{% for reagent in reagents %}
<option value="{{ reagent.id }}">
{{ reagent.name }}
{% if reagent.manufacturer %} — {{ reagent.manufacturer }}{% endif %}
</option>
{% endfor %}
</select>
</div>

<div class="col-md-6">
<label class="form-label">Lot Number</label>
<input name="lot_number" class="form-control" required>
</div>

<div class="col-md-6">
<label class="form-label">Expiry Date</label>
<input type="date" name="expiry_date" class="form-control" required>
</div>

<div class="col-md-6">
<label class="form-label">Quantity</label>
<input type="number" step="0.01" name="quantity"
class="form-control" value="0">
</div>

<div class="col-md-6">
<label class="form-label">Minimum Stock</label>
<input type="number" step="0.01" name="minimum_stock"
class="form-control" value="0">
</div>

<div class="col-md-6">
<label class="form-label">Supplier</label>
<input name="supplier" class="form-control">
</div>

<div class="col-md-6">
<label class="form-label">Purchase Price</label>
<input type="number" step="0.01" name="purchase_price"
class="form-control" value="0">
</div>

<div class="col-12">
<label class="form-label">Notes</label>
<textarea name="notes" class="form-control" rows="3"></textarea>
</div>

</div>

<div class="mt-4">
<button class="btn btn-success">حفظ المخزون</button>
<a href="{% url 'laboratory:inventory_dashboard' %}"
class="btn btn-secondary">إلغاء</a>
</div>

</form>
</div>
{% endblock %}
