{% extends "base.html" %}
{% block title %}إنشاء زيارة{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-xl-9"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="page-title mb-1">إنشاء زيارة جديدة</h1><p class="page-subtitle mb-0">تسجيل زيارة للمريض وربطها بالقسم والطبيب</p></div></div><div class="card"><div class="card-body p-4"><div class="alert alert-primary"><strong>المريض:</strong> {{ patient.full_name }} <span class="mx-2">·</span> <strong>رقم الملف:</strong> {{ patient.patient_number }}</div><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">رقم الزيارة</label><input class="form-control" type="text" name="visit_number" placeholder="V-000001" required></div><div class="col-md-6"><label class="form-label">نوع الزيارة</label><select class="form-select" name="visit_type" required><option value="OPD">عيادة خارجية</option><option value="ER">طوارئ</option><option value="INPATIENT">تنويم</option><option value="FOLLOWUP">متابعة</option></select></div><div class="col-md-6"><label class="form-label">القسم</label><select class="form-select" name="department" id="department" required><option value="">اختر القسم</option>{% for department in departments %}<option value="{{ department.id }}">{{ department.name_ar }} — {{ department.name_en }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">الطبيب</label><select class="form-select" name="doctor" id="doctor" required><option value="">اختر الطبيب</option>{% for doctor in doctors %}<option value="{{ doctor.id }}" data-department="{{ doctor.department_id }}">د. {{ doctor.full_name }} — {{ doctor.get_specialty_display }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">سبب الزيارة</label><textarea class="form-control" name="reason" rows="3" placeholder="سبب حضور المريض..."></textarea></div><div class="col-12"><label class="form-label">الطبيب المحول</label><input class="form-control" type="text" name="referring_doctor"></div><div class="col-12"><label class="form-label">ملاحظات</label><textarea class="form-control" name="notes" rows="3"></textarea></div></div><div class="d-flex gap-2 mt-4"><button class="btn btn-primary" type="submit">💾 حفظ الزيارة</button><a class="btn btn-outline-secondary" href="{% url 'reception:patient_profile' patient.id %}">إلغاء</a></div></form></div></div></div></div>
<script>const department=document.getElementById('department');const doctor=document.getElementById('doctor');department.addEventListener('change',()=>{Array.from(doctor.options).forEach(option=>{option.hidden=!!option.dataset.department&&option.dataset.department!==department.value;});doctor.value='';});</script>
{% endblock %}
