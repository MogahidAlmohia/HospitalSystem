{% extends "inventory/_form.html" %}
{% block content %}
<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h3>صرف مخزون</h3>
            <div class="text-muted">خصم كمية من دفعة مخزون موجودة</div>
        </div>
        <a href="{% url 'inventory:stock_list' %}" class="btn btn-outline-secondary">الرصيد</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-bold">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                </div>
                {% endfor %}
                <button class="btn btn-warning">تنفيذ الصرف</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
