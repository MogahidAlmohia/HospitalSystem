{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3" dir="rtl">

    <div class="mb-3">
        <h3>📥 إدخال مخزون</h3>
        <p class="text-muted">
            {{ medicine.name_ar }} — {{ medicine.code }}
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="alert alert-info">
                الرصيد الحالي:
                <strong>{{ medicine.stock_quantity }}</strong>
                {{ medicine.unit }}
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">الكمية المستلمة</label>
                    <input type="number"
                           name="quantity"
                           class="form-control"
                           min="0.01"
                           step="0.01"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">رقم المرجع / فاتورة التوريد</label>
                    <input type="text"
                           name="reference"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">ملاحظات</label>
                    <textarea name="notes"
                              class="form-control"
                              rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    📥 حفظ الإدخال
                </button>

                <a href="{% url 'pharmacy:stock_list' %}"
                   class="btn btn-secondary">
                    رجوع
                </a>
            </form>

        </div>
    </div>

</div>
{% endblock %}
