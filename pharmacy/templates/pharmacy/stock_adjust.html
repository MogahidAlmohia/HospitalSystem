{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3" dir="rtl">

    <div class="mb-3">
        <h3>⚖️ تسوية المخزون</h3>
        <p class="text-muted">
            {{ medicine.name_ar }} — {{ medicine.code }}
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="alert alert-warning">
                الرصيد الحالي:
                <strong>{{ medicine.stock_quantity }}</strong>
                {{ medicine.unit }}
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        الرصيد الجديد الفعلي
                    </label>

                    <input type="number"
                           name="new_quantity"
                           class="form-control"
                           min="0"
                           step="0.01"
                           value="{{ medicine.stock_quantity }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">رقم المرجع</label>
                    <input type="text"
                           name="reference"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        سبب التسوية / ملاحظات
                    </label>

                    <textarea name="notes"
                              class="form-control"
                              rows="3"
                              required></textarea>
                </div>

                <button type="submit"
                        class="btn btn-warning">
                    ⚖️ حفظ التسوية
                </button>

                <a href="{% url 'pharmacy:stock_list' %}"
                   class="btn btn-secondary">
                    إلغاء
                </a>

            </form>

        </div>
    </div>

</div>
{% endblock %}
